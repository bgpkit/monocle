[package]
name = "monocle"
version = "1.5.0"
authors = ["Mingwei Zhang <mingwei@bgpkit.com>"]
edition = "2021"
readme = "README.md"
license = "MIT"
repository = "https://github.com/bgpkit/monocle"
documentation = "https://docs.rs/monocle"
description = """
A commandline application to search, parse, and process BGP information in public sources.
"""
keywords = ["bgp", "bgpkit", "mrt"]

[[bin]]
name = "monocle"
path = "src/bin/monocle.rs"
required-features = ["cli"]

# =============================================================================
# Examples - One per lens
# =============================================================================

[[example]]
name = "time_lens"
path = "examples/time_lens.rs"
required-features = ["lib"]

[[example]]
name = "country_lens"
path = "examples/country_lens.rs"
required-features = ["lib"]

[[example]]
name = "ip_lens"
path = "examples/ip_lens.rs"
required-features = ["lib"]

[[example]]
name = "parse_lens"
path = "examples/parse_lens.rs"
required-features = ["lib"]

[[example]]
name = "only_to_customer"
path = "examples/only_to_customer.rs"
required-features = ["lib"]

[[example]]
name = "search_lens"
path = "examples/search_lens.rs"
required-features = ["lib"]

[[example]]
name = "rpki_lens"
path = "examples/rpki_lens.rs"
required-features = ["lib"]

[[example]]
name = "pfx2as_lens"
path = "examples/pfx2as_lens.rs"
required-features = ["lib"]

[[example]]
name = "as2rel_lens"
path = "examples/as2rel_lens.rs"
required-features = ["lib"]

[[example]]
name = "inspect_lens"
path = "examples/inspect_lens.rs"
required-features = ["lib"]

[[example]]
name = "database"
path = "examples/database.rs"
required-features = ["lib"]

[[example]]
name = "db_refresh_bench"
path = "examples/db_refresh_bench.rs"
required-features = ["lib"]
[features]
default = ["cli"]

# =============================================================================
# Feature flags
# =============================================================================

# Library feature - includes all database operations, lenses, and display
lib = [
    # Live stream (RIS Live websocket)
    "bgpkit-parser/rislive",
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "dep:rustls",
    # Database
    "dep:oneio",
    "dep:ipnet",
    "dep:tempfile",
    # Lenses
    "dep:chrono-humanize",
    "dep:dateparser",
    "dep:humantime",
    "dep:bgpkit-broker",
    "dep:bgpkit-parser",
    "dep:bgpkit-commons",
    "dep:itertools",
    "dep:rayon",
    "dep:regex",
    # Display (always included with lib)
    "dep:tabled",
]

# HTTP/SSE server feature - for programmatic API access
# Can be used standalone or with CLI
server = [
    "lib",
    "dep:axum",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-stream",
    "dep:futures",
    "dep:tower-http",
]

# CLI feature - full binary with all functionality
# Includes lib and server features
cli = [
    "lib",
    "server",
    "dep:clap",
    "dep:indicatif",
    "dep:tracing-subscriber",
    "dep:libc",
    "dep:reqwest",
]


# Full build (backward compatibility alias)
full = ["cli"]

[dependencies]
# =============================================================================
# Core dependencies (always included)
# =============================================================================
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.15", features = ["toml"] }
etcetera = "0.11.0"
dotenvy = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# =============================================================================
# Library dependencies (enabled by "lib" feature)
# =============================================================================

# Database
ipnet = { version = "2.10", features = ["json"], optional = true }
oneio = { version = "0.24.2", default-features = false, features = ["https", "gz", "bz", "json", "zstd"], optional = true }
tempfile = { version = "3", optional = true }

# Lenses
chrono-humanize = { version = "0.2", optional = true }
dateparser = { version = "0.2", optional = true }
humantime = { version = "2.1", optional = true }
bgpkit-broker = { version = "0.10.1", optional = true }
bgpkit-parser = { version = "0.20.0", features = ["serde"], optional = true }
bgpkit-commons = { version = "0.12.0", features = ["asinfo", "rpki", "countries"], optional = true }
itertools = { version = "0.14", optional = true }
rayon = { version = "1.8", optional = true }
regex = { version = "1.11", optional = true }

# Display
tabled = { version = "0.21", optional = true }

# =============================================================================
# Server dependencies (enabled by "server" feature)
# =============================================================================
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots", "connect"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
futures-util = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }

# =============================================================================
# CLI-only dependencies (enabled by "cli" feature)
# =============================================================================
clap = { version = "4.1", features = ["derive"], optional = true }
libc = { version = "0.2", optional = true }
indicatif = { version = "0.18.0", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
